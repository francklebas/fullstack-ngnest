services:
  api:
    build: .
    user: node
    env_file:
      - .env
    expose:
      - '3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      SSL_ENABLED: 'false'
      CORS_MODE: ${CORS_MODE:-whitelist}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-1048576}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      - api
    expose:
      - '8080'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    depends_on:
      - nginx
    ports:
      - '80:8080'
      - '443:8443'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:uid=10001,gid=10001,mode=700
      - /config:uid=10001,gid=10001,mode=700

  db:
    image: postgres:13
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: